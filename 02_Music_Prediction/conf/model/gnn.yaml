name: gnn
# Experimental per-window modality graph prior, not a learned or causal sensor graph.
# Trainer supplies dynamic input_dim and train-fitted transformed feature_names.
# Set graph_input: true only for external consumers providing explicit PyG Data/Batch.
graph_input: false
graph_level: true
hidden_dim: 64
num_layers: 2
dropout: 0.1
learning_rate: 0.001
weight_decay: 0.0001
max_epochs: 100
early_stopping_patience: 12
scheduler_patience: 4
random_state: 42
