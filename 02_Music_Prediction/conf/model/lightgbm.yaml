name: lightgbm
# CPU is portable; gpu uses OpenCL, cuda requires a CUDA-enabled LightGBM build.
device_type: cpu
# null uses the backend default; -1 also selects the default device/platform.
gpu_device_id: null
# OpenCL only; keep null for cpu/cuda.
gpu_platform_id: null
num_rounds: 300
num_leaves: 31
max_depth: 8
min_data_in_leaf: 50
learning_rate: 0.05
feature_fraction: 0.8
bagging_fraction: 0.8
bagging_freq: 1
lambda_l1: 0.0
lambda_l2: 1.0
early_stopping_rounds: 30
n_jobs: 4
random_state: 42
