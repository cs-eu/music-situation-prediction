name: music-prediction
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.11
  - scikit-learn>=1.4
  - joblib>=1.3
  - pyreadr>=0.5
  - pip:
      - torch>=2.6
      - hydra-core>=1.3.2
      - omegaconf>=2.3
# Optional model/tool extras are defined in setup.py and are installed separately.
# No host-specific paths, CUDA toolkit pins, or private package index installs.
